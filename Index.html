<!DOCTYPE html><html lang="en" ><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professional Task List</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2C1B17;display:flex;justify-content:center;min-height:100vh;font-family:'Inter',system-ui}
.app{width:100%;max-width:440px;background:#FFFDF8;min-height:100vh;display:flex;flex-direction:column;position:relative}
.hdr{padding:18px 16px;background:linear-gradient(135deg,#3E2723 0%,#4E342E 100%);display:flex;justify-content:space-between;align-items:center}
.tt{font-family:Plus Jakarta Sans,sans-serif;font-size:17px;font-weight:800;color:#fff}
.sub{font-size:10px;color:#D7CCC8;margin-top:3px}
.pill{background:#F9E076;color:#3E2723;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:800;min-width:50px;text-align:center}
.bell{width:40px;height:40px;background:rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#F9E076}
.dateBar{background:#F9E076;color:#3E2723;padding:10px 16px;display:flex;justify-content:center;align-items:center;font-size:11px;font-weight:700}
.pageInfo{background:#2C1B17;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.pageNum{font-size:12px;font-weight:800;color:#F9E076}
.stats{padding:10px;background:#3E2723;display:flex;gap:8px} .stat{flex:1;background:#4E342E;border-radius:12px;padding:10px;text-align:center} .sn{font-size:18px;font-weight:800;color:#F9E076} .sl{font-size:9px;color:#BCAAA4;margin-top:2px}
.addSec{padding:12px;background:#fff;display:flex;gap:8px;align-items:center;border-bottom:2px solid #3E2723} .inp{flex:1;background:#FFF3E0;border:2px solid #3E2723;border-radius:24px;padding:10px 16px;font-size:13px;outline:none;color:#3E2723} .btnMic{width:42px;height:42px;background:#FFF8E1;border:2px solid #3E2723;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0} .btnAdd{background:#3E2723;color:#F9E076;border:none;border-radius:20px;padding:10px 16px;font-size:12px;font-weight:800;cursor:pointer}
.list{flex:1;padding:12px 12px 110px;background:#FFFDF8;min-height:380px} .task{background:#fff;border:2px solid #3E2723;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start} .task.done{opacity:0.6} .cb{width:22px;height:22px;border:3px solid #3E2723;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff} .cb.checked{background:#2E7D32;border-color:#2E7D32;color:#fff} .cb.checked::after{content:'✓';font-size:11px;font-weight:900} .tTxt{font-size:13px;color:#3E2723;font-weight:600;flex:1} .del{width:26px;height:26px;border-radius:50%;background:#FFEBEE;border:1px solid #EF9A9A;color:#C62828;cursor:pointer;opacity:0} .task:hover .del{opacity:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:linear-gradient(135deg,#3E2723 0%,#4E342E 100%);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:20} .navBtn{background:#F9E076;color:#3E2723;border:none;border-radius:24px;padding:12px 18px;font-size:13px;font-weight:800;cursor:pointer;min-width:85px} .navBtn:disabled{opacity:0.4} .navCenter{text-align:center;flex:1} .navPill{background:rgba(249,224,118,0.15);border:1px solid rgba(249,224,118,0.3);color:#F9E076;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block}
</style></head><body>
<div class="app">
<div class="hdr"><div><div class="tt">Professional Task List</div><div class="sub">Professional • Strong</div></div><div style="display:flex;gap:8px;align-items:center"><div class="bell" onclick="notifyPage()">🔔</div><div class="pill" id="pill">1</div></div></div>
<div class="dateBar">📅 <span id="dateStr">Tuesday, September 8, 2026</span></div>
<div class="pageInfo"><div class="pageNum" id="pageNum">Page 1</div><div style="font-size:11px;color:#8D6E63" id="countInfo">0 tasks</div></div>
<div class="stats"><div class="stat"><div class="sn" id="sTotal">0</div><div class="sl">Total</div></div><div class="stat"><div class="sn" id="sDone">0</div><div class="sl">Done</div></div><div class="stat"><div class="sn" id="sPend">0</div><div class="sl">Pending</div></div></div>
<div class="addSec"><input id="inp" class="inp" placeholder="New task..." onkeypress="if(event.key==='Enter')addTask()"><div class="btnMic" id="mic" onclick="mic()">🎤</div><button class="btnAdd" onclick="addTask()">+ Add</button></div>
<div class="list" id="list"></div>
<div class="nav"><button class="navBtn" id="prevBtn" onclick="prevPage()">‹ Previous</button><div class="navCenter"><div class="navPill" id="navPill">1</div><div style="font-size:10px;color:#BCAAA4;margin-top:3px">Tuesday, September 8, 2026</div></div><button class="navBtn" id="nextBtn" onclick="nextPage()">Next ›</button></div>
</div>
<script>
let currentPage=1;
let tasks=JSON.parse(localStorage.getItem('anon_en')||'{}');
function getPageTasks(p){return tasks[p]||[];}
function savePage(p,pageTasks){tasks[p]=pageTasks;localStorage.setItem('anon_en',JSON.stringify(tasks));updateStats();}
function updateStats(){
const pageTasks=getPageTasks(currentPage);
const totalAll=Object.values(tasks).flat().length;
document.getElementById('sTotal').textContent=totalAll;
document.getElementById('sDone').textContent=pageTasks.filter(t=>t.done).length;
document.getElementById('sPend').textContent=pageTasks.filter(t=>!t.done).length;
document.getElementById('countInfo').textContent=pageTasks.length+' tasks';
document.getElementById('pill').textContent=currentPage;
document.getElementById('pageNum').textContent='Page '+currentPage;
document.getElementById('navPill').textContent=currentPage;
document.getElementById('prevBtn').disabled=currentPage===1;
}
function render(){
const pageTasks=getPageTasks(currentPage);
const list=document.getElementById('list');
if(pageTasks.length===0){
list.innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:42px;margin-bottom:10px">📄</div><div style="font-size:15px;font-weight:700;color:#5D4037">No tasks</div><div style="font-size:12px;color:#8D6E63;margin-top:6px">Add your first task</div></div>`;
return;
}
list.innerHTML=pageTasks.map((t,idx)=>`<div class="task ${t.done?'done':''}"><div class="cb ${t.done?'checked':''}" onclick="toggleTask(${idx})"></div><div class="tTxt">${t.text}</div><button class="del" onclick="delTask(${idx})">✕</button></div>`).join('');
}
function addTask(){
const inp=document.getElementById('inp');
const v=inp.value.trim();if(!v)return;
const pageTasks=getPageTasks(currentPage);
pageTasks.unshift({text:v,done:false});
savePage(currentPage,pageTasks);
inp.value='';
render();
}
function toggleTask(idx){const pageTasks=getPageTasks(currentPage);pageTasks[idx].done=!pageTasks[idx].done;savePage(currentPage,pageTasks);render();}
function delTask(idx){const pageTasks=getPageTasks(currentPage);pageTasks.splice(idx,1);savePage(currentPage,pageTasks);render();}
function prevPage(){if(currentPage===1)return;currentPage--;updateStats();render();window.scrollTo(0,0);}
function nextPage(){currentPage++;if(!tasks[currentPage])tasks[currentPage]=[];updateStats();render();window.scrollTo(0,0);}
function notifyPage(){if(Notification.permission!=='granted')Notification.requestPermission().then(()=>new Notification('Page '+currentPage));else new Notification('Page '+currentPage);}
let rec=null,recing=false;
function mic(){
const b=document.getElementById('mic');
if(recing){rec.stop();return;}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert('Use Chrome');return;}
rec=new SR();rec.lang='en-US';rec.continuous=false;
rec.onstart=()=>{recing=true;b.style.background='#EF5350';}
rec.onend=()=>{recing=false;b.style.background='#FFF8E1';}
rec.onresult=e=>{document.getElementById('inp').value=e.results[0][0].transcript;};
rec.start();
}
updateStats();render();
</script></body></html>
